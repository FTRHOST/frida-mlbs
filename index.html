<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLBB Tracer Dashboard</title>
    <style>
        :root {
            --bg-dark: #1e1e2e;
            --bg-panel: #282a36;
            --text-main: #f8f8f2;
            --accent: #bd93f9;
            --success: #50fa7b;
            --danger: #ff5555;
            --warning: #f1fa8c;
        }
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh;
        }
        /* Sidebar Panel */
        .sidebar {
            width: 300px; background-color: var(--bg-panel); padding: 20px;
            display: flex; flex-direction: column; gap: 15px; border-right: 1px solid #444;
        }
        .sidebar h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        input, select { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #383a59; color: white; }
        button {
            padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s;
        }
        .btn-start { background-color: var(--success); color: #000; }
        .btn-clear { background-color: var(--danger); color: white; margin-top: auto; }
        button:hover { opacity: 0.8; }
        
        /* Main Log Area */
        .main-content {
            flex: 1; display: flex; flex-direction: column; padding: 20px;
        }
        .toolbar { display: flex; gap: 10px; margin-bottom: 15px; }
        .toolbar input { flex: 1; }
        
        .log-container {
            flex: 1; background-color: #000; border-radius: 8px; padding: 15px;
            overflow-y: auto; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem;
        }
        .log-line { margin-bottom: 5px; line-height: 1.4; border-bottom: 1px dashed #333; padding-bottom: 3px; }
        .badge { background: var(--accent); color: #000; padding: 2px 6px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; margin-left: 10px; }
        .type-call { color: var(--success); }
        .type-change { color: var(--warning); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Tracer Controls</h2>
        
        <div class="control-group">
            <label>Target Class:</label>
            <input type="text" id="targetClass" placeholder="e.g. SystemData" value="SystemData">
        </div>
        
        <div class="control-group">
            <label>Mode:</label>
            <select id="traceMode">
                <option value="simple">Simple Trace (Call Only)</option>
                <option value="full">Full Trace (Dump Data)</option>
                <option value="track">Track Specific Fields</option>
            </select>
        </div>

        <button class="btn-start" onclick="startHook()">Inject & Start</button>
        <button class="btn-clear" onclick="clearLogs()">Clear Console</button>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <input type="text" id="searchFilter" placeholder="Filter logs (e.g. Update, IsForbidSkin)..." oninput="filterLogs()">
        </div>
        <div class="log-container" id="logContainer">
            <div style="color: #6272a4;">[System] Menunggu koneksi dari Frida...</div>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('logContainer');
        let logHistory = {}; // Untuk menyimpan log agar tidak spam

        function startHook() {
            const cls = document.getElementById('targetClass').value;
            const mode = document.getElementById('traceMode').value;
            appendLog(`[System] Mengirim perintah inject ke class: ${cls} (Mode: ${mode})`, 'system');
            
            // Di sini nantinya kita akan memanggil API/WebSocket ke Node.js
            // Untuk simulasi UI, kita panggil fungsi simulasi
            simulateIncomingFridaLog(`[CALL] ${cls}::Update terpanggil.`);
        }

        // Fungsi untuk menerima log dari Frida (via WebSocket nantinya)
        function appendLog(message, type = 'call') {
            // ANTI-SPAM LOGIC
            // Jika log pesannya sama persis, jangan buat baris baru, cukup tambahkan counter (x2, x3, dst)
            if (logHistory[message]) {
                logHistory[message].count++;
                document.getElementById(`badge-${logHistory[message].id}`).innerText = `x${logHistory[message].count}`;
                return;
            }

            // Jika log baru
            const logId = Date.now() + Math.random().toString(16).slice(2);
            logHistory[message] = { id: logId, count: 1, text: message };

            const logEl = document.createElement('div');
            logEl.className = `log-line type-${type}`;
            logEl.innerHTML = `${message} <span class="badge" id="badge-${logId}" style="display:none;">x1</span>`;
            
            logContainer.appendChild(logEl);
            logContainer.scrollTop = logContainer.scrollHeight; // Auto-scroll ke bawah

            // Tampilkan badge jika count > 1
            setTimeout(() => {
                if(logHistory[message].count > 1) {
                    document.getElementById(`badge-${logId}`).style.display = 'inline-block';
                }
            }, 100);
        }

        function clearLogs() {
            logContainer.innerHTML = '';
            logHistory = {}; // Reset anti-spam counter
        }

        function filterLogs() {
            const query = document.getElementById('searchFilter').value.toLowerCase();
            const logs = document.querySelectorAll('.log-line');
            logs.forEach(log => {
                if (log.innerText.toLowerCase().includes(query)) {
                    log.style.display = 'block';
                } else {
                    log.style.display = 'none';
                }
            });
        }

        // --- SIMULASI --- (Hapus ini saat dihubungkan ke Node.js)
        function simulateIncomingFridaLog(msg) {
            setInterval(() => {
                appendLog(msg, 'call'); // Mensimulasikan log Update yang dipanggil berulang kali
            }, 50); // Spam setiap 50ms
        }
    </script>
</body>
</html>
